apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs: { env: prod }
replicas:
  - name: whoami
    count: 3
patches:
  - target: { kind: Ingress, name: whoami }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: whoami-prod.localtest.me
