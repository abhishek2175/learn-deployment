apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 1
  selector:
    matchLabels: { app: whoami }
  template:
    metadata:
      labels: { app: whoami }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11
          args: ["--port", "8080"]
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits:   { memory: 64Mi }
