# Our own Helm chart deployed to dev + prod.
# matrix = (every registered cluster) x (each env) -> one Application each.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hello
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
          - list:
              elements:
                - env: dev
                - env: prod
  template:
    metadata:
      name: 'hello-{{ .env }}'
    spec:
      project: default
      source:
        repoURL: '{{ .metadata.annotations.repo_url }}'
        targetRevision: '{{ .metadata.annotations.repo_revision }}'
        path: gitops/charts/hello
        helm:
          valueFiles:
            - values.yaml
            - '../../envs/{{ .env }}/hello.yaml'
          parameters:
            # Terraform -> cluster secret annotation -> Helm value
            - name: clusterName
              value: '{{ .metadata.annotations.cluster_name }}'
      destination:
        server: '{{ .server }}'
        namespace: 'hello-{{ .env }}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
