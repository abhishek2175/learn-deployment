# Kustomize app. The git *directory* generator creates one Application per
# folder under overlays/ - add overlays/staging and it appears automatically.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: whoami
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
          - git:
              repoURL: '{{ .metadata.annotations.repo_url }}'
              revision: '{{ .metadata.annotations.repo_revision }}'
              directories:
                - path: gitops/apps/whoami/overlays/*
  template:
    metadata:
      name: 'whoami-{{ .path.basename }}'
    spec:
      project: default
      source:
        repoURL: '{{ .metadata.annotations.repo_url }}'
        targetRevision: '{{ .metadata.annotations.repo_revision }}'
        path: '{{ .path.path }}'
      destination:
        server: '{{ .server }}'
        namespace: 'whoami-{{ .path.basename }}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
