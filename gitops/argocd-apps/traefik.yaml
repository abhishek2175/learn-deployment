# Platform add-on: a third-party Helm chart, with our values file living in Git.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # platform before apps
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: traefik
    spec:
      project: default
      sources:
        - repoURL: https://traefik.github.io/charts
          chart: traefik
          targetRevision: "*"            # pin a real version once it works
          helm:
            valueFiles:
              - $values/gitops/platform/traefik/values.yaml
        - repoURL: '{{ .metadata.annotations.repo_url }}'
          targetRevision: '{{ .metadata.annotations.repo_revision }}'
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: traefik
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
