# Runs on the kind node labelled ingress-ready=true and binds host port 80,
# which kind maps to your Mac (see terraform/main.tf extra_port_mappings).
deployment:
  replicas: 1
# Single node + hostPort 80: the old pod must stop before the new one can bind the port.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
nodeSelector:
  ingress-ready: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
ports:
  web:
    hostPort: 80
service:
  type: ClusterIP
ingressClass:
  enabled: true
  isDefaultClass: true
providers:
  kubernetesIngress:
    publishedService:
      enabled: false
# Report 127.0.0.1 as the Ingress address so Argo CD marks Ingresses Healthy
# (it waits for status.loadBalancer, which a ClusterIP service never gets).
additionalArguments:
  - --providers.kubernetesingress.ingressendpoint.ip=127.0.0.1
